# =============================================================================
# Point systemd-resolved at the local unbound resolver
# Installed on HOST as /etc/systemd/resolved.conf.d/unbound.conf
# =============================================================================
#
# See host/etc/unbound/unbound.conf.d/iredmail.conf for the full rationale.
# Short version: the shared IONOS resolvers (212.227.123.16/17) are refused by
# uribl.com, which silently disabled every URI blocklist in SpamAssassin.
#
# Deliberately NO fallback to the IONOS resolvers. A fallback would keep mail
# flowing if unbound died, but it would do so by silently reverting to a shared
# resolver — i.e. spam filtering would quietly degrade again with nothing in the
# logs. That failure mode is exactly what took months to notice last time.
# unbound runs as a supervised systemd unit (Restart=on-failure, enabled at
# boot), so a hard failure is both unlikely and loud.
#
# `Domains=~.` is load-bearing, not decoration. netplan runs the link on DHCP,
# so ens6 still carries the provider's DNS servers (212.227.123.16/17) and
# link-level DNS normally outranks the global setting. Making the global config
# a catch-all routing domain is what pulls every query to unbound instead.
# Verified after applying: querying the resolved stub for the URIBL test point
# returns 127.0.0.14 + TXT "permanent testpoint" rather than the 127.0.0.1
# "Query Refused" sentinel. /etc/resolv.conf needs no change — the container
# chain (127.0.0.11 -> host(127.0.0.53) -> unbound) follows automatically, and
# container-name resolution for `db` keeps working.
#
# CANARY: if this ever silently reverts, `URIBL_BLOCKED` reappears in the
# X-Spam-Status header of every delivered message. That is the cheapest way to
# spot it — check a recent mail's headers, not the resolver config.
# =============================================================================

[Resolve]
DNS=127.0.0.1
Domains=~.
