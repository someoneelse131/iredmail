# =============================================================================
# Local recursive resolver for the mail server
# Installed on HOST as /etc/unbound/unbound.conf.d/iredmail.conf
# (NOT part of the container image)
# =============================================================================
#
# Why this exists (2026-08-07): the host used the shared IONOS resolvers
# (212.227.123.16/17). DNSBL and URIBL operators refuse queries coming from
# shared/public resolvers, so every message scored URIBL_BLOCKED:
#
#   test.uribl.com.multi.uribl.com
#     -> "Query Refused ... [Your DNS IP: 212.227.222.195]"
#
# That silently disabled all URI blocklists in SpamAssassin — the single
# strongest signal against the link-heavy spam this server actually receives.
# With full local recursion, queries leave from the server's own IP and URIBL
# answers normally (test point now returns 127.0.0.14 = black+grey+red).
#
# FULL RECURSION IS THE POINT: do NOT add `forward-zone:` here. Forwarding to
# Quad9/Cloudflare/Google would put us back behind a shared resolver and
# re-break URIBL, just with a different upstream.
#
# Chain: container -> 127.0.0.11 (docker embedded DNS, ExtServers host(127.0.0.53))
#        -> 127.0.0.53 systemd-resolved (host netns) -> 127.0.0.1 unbound -> root
#
# NOTE: do NOT set `dns:` on the container in docker-compose.yml to point here.
# The core container resolves the database by container name via Docker's
# embedded DNS; overriding `dns:` breaks that. Changing the host resolver
# propagates automatically, which is why this is a host-level file.
# =============================================================================

server:
    # Loopback only. unbound must never be reachable from the internet — an
    # open recursive resolver is an amplification-attack participant.
    interface: 127.0.0.1
    interface: ::1
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # DNSBL/URIBL lookups run per message and sit directly in the delivery path,
    # so cache hit rate translates into mail throughput. prefetch refreshes
    # popular entries before they expire instead of stalling a delivery on a
    # cold lookup.
    msg-cache-size: 64m
    rrset-cache-size: 128m
    prefetch: yes

    # Don't advertise what we are.
    hide-identity: yes
    hide-version: yes

    # Send only the minimum necessary label to each authoritative server.
    qname-minimisation: yes
