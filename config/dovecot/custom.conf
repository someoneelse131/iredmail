# =============================================================================
# Dovecot Custom Configuration
# This file is included as /etc/dovecot/conf.d/99-custom.conf
# =============================================================================

# =============================================================================
# Logging - Write to shared directory for fail2ban integration
# =============================================================================
log_path = /var/log/iredmail/dovecot.log
info_log_path = /var/log/iredmail/dovecot.log
debug_log_path = /var/log/iredmail/dovecot.log

# =============================================================================
# Custom Settings
# =============================================================================

# Example: Increase mail process limits
# mail_max_userip_connections = 50

# Example: Enable debugging
# mail_debug = yes
# auth_debug = yes

# =============================================================================
# lazy_expunge - verschiebt gelöschte Mails statt sie zu löschen
# =============================================================================
protocol imap {
  mail_plugins = $mail_plugins lazy_expunge
}

protocol lmtp {
  mail_plugins = $mail_plugins lazy_expunge
}

namespace {
  prefix = .EXPUNGED/
  hidden = yes
  list = no
  subscriptions = no
  location = maildir:~/Maildir/.EXPUNGED
}

plugin {
  lazy_expunge = .EXPUNGED/
}

# =============================================================================
# Junk-Ordner automatisch anlegen (2026-09-06)
# =============================================================================
# 15-mailboxes.conf definiert `mailbox Junk` nur mit special_use, ohne `auto`.
# Dovecot legt den Ordner damit nie von sich aus an, und lda_mailbox_autocreate
# steht auf no. Fuer ein Postfach, das noch nie mit einem IMAP-Client geoeffnet
# wurde, existiert `Junk` also nicht — und `fileinto "Junk"` aus
# before.d/spam-to-junk.sieve laeuft ins Leere. Sieve faellt dann auf implicit
# keep zurueck und der Spam landet stillschweigend im Posteingang.
#
# Am 2026-09-06 gemessen: 10 von 12 Postfaechern hatten keinen Junk-Ordner,
# darunter acc@maisonsoave.ch (37 Mails) und postmaster@kirby.rocks (101). Sie
# sind bisher nur deshalb nicht aufgefallen, weil sie kaum Spam bekommen haben.
#
# `auto = subscribe` legt den Ordner beim ersten Zugriff auf den Namespace an
# (auch bei LMTP-Zustellung) und traegt ihn in die subscriptions ein, sonst
# blendet Thunderbird ihn per Default aus. Named-namespace-Bloecke werden von
# Dovecot mit der Definition aus 15-mailboxes.conf zusammengefuehrt, diese
# Datei laeuft als 99-custom.conf danach.
namespace inbox {
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}
